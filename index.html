<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPS & 音声ロガー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header { margin-bottom: 16px; text-align: center; }
    h1 { font-size: 20px; font-weight: 700; color: #38bdf8; }
    #status-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: #334155;
      color: #94a3b8;
    }
    #status-badge.active { background: #065f46; color: #34d399; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .card.full { grid-column: span 2; }
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .unit { font-size: 12px; font-weight: 400; color: #64748b; margin-left: 2px; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #btnStart { background: #0284c7; color: #fff; }
    #btnStop { background: #ef4444; color: #fff; }
    #btnDownload { background: #10b981; color: #fff; }
    #meter-container {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    #meter-bar {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.05s linear;
    }
  </style>
</head>
<body>

  <header>
    <h1>GPS ＆ 音圧ロガー</h1>
    <div id="status-badge">待機中</div>
  </header>

  <div class="grid">
    <!-- 騒音・音圧 -->
    <div class="card full">
      <div class="label">騒音レベル (RMS) / 最大ピーク振幅</div>
      <div class="value">
        <span id="valVol">0.0</span><span class="unit">RMS</span>
        <span style="font-size: 14px; color: #64748b; margin-left: 8px;">Peak: <span id="valPeak" style="color: #cbd5e1;">0.00</span></span>
      </div>
      <div id="meter-container">
        <div id="meter-bar"></div>
      </div>
    </div>

    <!-- 記録状態 -->
    <div class="card full">
      <div class="label">記録件数 / 最終打刻 (UNIXミリ秒)</div>
      <div id="valCount" class="value">0 <span class="unit">件</span></div>
      <div id="valTimestamp" style="font-size: 12px; color: #64748b; font-family: monospace; margin-top: 4px;">-</div>
    </div>

    <!-- 速度・精度 -->
    <div class="card">
      <div class="label">移動速度</div>
      <div class="value"><span id="valSpeed">0.0</span><span class="unit">km/h</span></div>
    </div>
    <div class="card">
      <div class="label">測位精度</div>
      <div class="value"><span id="valAccuracy">-</span><span class="unit">m</span></div>
    </div>

    <!-- 高度・ステータス -->
    <div class="card">
      <div class="label">海抜高度</div>
      <div class="value"><span id="valAltitude">-</span><span class="unit">m</span></div>
    </div>
    <div class="card">
      <div class="label">GPS ステータス</div>
      <div id="valFix" class="value" style="font-size: 16px; line-height: 28px;">未取得</div>
    </div>

    <!-- 座標 -->
    <div class="card full">
      <div class="label">現在座標 (緯度, 経度)</div>
      <div id="valCoords" class="value" style="font-size: 15px; word-break: break-all;">-, -</div>
    </div>
  </div>

  <div class="actions">
    <button id="btnStart">計測・記録開始</button>
    <button id="btnStop" disabled>記録停止</button>
    <button id="btnDownload" disabled>CSV ダウンロード</button>
  </div>

  <script>
    let watchId = null;
    let wakeLock = null;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let samplingTimer = null;

    // 最新のGPSキャッシュ
    let curLat = "", curLng = "", curAlt = "", curSpd = "0.0", curAcc = "";
    // 最新の音圧値
    let curRms = 0.0, curPeak = 0.0;

    // CSV データヘッダー
    let records = [["timestamp", "latitude", "longitude", "altitude", "speed", "accuracy", "noise_rms", "noise_peak"]];

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnDownload = document.getElementById('btnDownload');
    const statusBadge = document.getElementById('status-badge');

    const valCount = document.getElementById('valCount');
    const valTimestamp = document.getElementById('valTimestamp');
    const valSpeed = document.getElementById('valSpeed');
    const valAccuracy = document.getElementById('valAccuracy');
    const valAltitude = document.getElementById('valAltitude');
    const valFix = document.getElementById('valFix');
    const valCoords = document.getElementById('valCoords');
    const valVol = document.getElementById('valVol');
    const valPeak = document.getElementById('valPeak');
    const meterBar = document.getElementById('meter-bar');

    // スリープ防止
    async function acquireWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); }
        catch (err) { console.warn('WakeLock error:', err); }
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    // マイクの初期化 (Web Audio API)
    async function initAudio() {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
    }

    // 音圧の解析
    const audioBuffer = new Float32Array(512);
    function sampleAudio() {
      if (!analyser) return;
      analyser.getFloatTimeDomainData(audioBuffer);

      let sumSq = 0.0;
      let peak = 0.0;

      for (let i = 0; i < audioBuffer.length; i++) {
        const val = audioBuffer[i];
        sumSq += val * val;
        const absVal = Math.abs(val);
        if (absVal > peak) peak = absVal;
      }

      curRms = Math.sqrt(sumSq / audioBuffer.length) * 100.0; // 0〜100スケール
      curPeak = peak;

      // 音量メーター表示更新
      valVol.innerText = curRms.toFixed(1);
      valPeak.innerText = curPeak.toFixed(2);
      meterBar.style.width = Math.min(curRms * 2.5, 100) + "%";
    }

    // GPS 測位ハンドラ
    function handlePosition(pos) {
      curLat = pos.coords.latitude.toFixed(6);
      curLng = pos.coords.longitude.toFixed(6);
      curAlt = pos.coords.altitude !== null ? pos.coords.altitude.toFixed(1) : "";
      curSpd = pos.coords.speed !== null && pos.coords.speed >= 0 ? (pos.coords.speed * 3.6).toFixed(1) : "0.0";
      curAcc = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : "";

      valSpeed.innerText = curSpd;
      valAccuracy.innerText = curAcc;
      valAltitude.innerText = curAlt !== "" ? curAlt : "-";
      valFix.innerText = "測位中 (良好)";
      valFix.style.color = "#34d399";
      valCoords.innerText = `${curLat}, ${curLng}`;
    }

    function handleError(err) {
      valFix.innerText = `GPSエラー: ${err.message}`;
      valFix.style.color = "#f87171";
    }

    // 記録開始
    btnStart.addEventListener('click', async () => {
      try {
        await initAudio();
      } catch (e) {
        alert("マイクへのアクセスに失敗しました: " + e.message);
        return;
      }

      if (!navigator.geolocation) {
        alert("位置情報に対応していません。");
        return;
      }

      await acquireWakeLock();

      // GPS監視開始
      watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });

      // 100ms周期 (10Hz) で音圧取得 ＆ CSVバッファ追加
      samplingTimer = setInterval(() => {
        sampleAudio();
        const now = Date.now();

        records.push([
          now,
          curLat,
          curLng,
          curAlt,
          curSpd,
          curAcc,
          curRms.toFixed(2),
          curPeak.toFixed(3)
        ]);

        valCount.innerHTML = `${records.length - 1} <span class="unit">件</span>`;
        valTimestamp.innerText = now;
      }, 100);

      statusBadge.innerText = "記録中 (GPS + 音声)";
      statusBadge.classList.add('active');

      btnStart.disabled = true;
      btnStop.disabled = false;
      btnDownload.disabled = true;
    });

    // 記録停止
    btnStop.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (samplingTimer !== null) {
        clearInterval(samplingTimer);
        samplingTimer = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (audioCtx) {
        audioCtx.close();
      }
      releaseWakeLock();

      statusBadge.innerText = "一時停止中";
      statusBadge.classList.remove('active');
      valFix.innerText = "停止";
      valFix.style.color = "#94a3b8";

      btnStart.disabled = false;
      btnStop.disabled = true;
      btnDownload.disabled = records.length <= 1;
    });

    // CSV ダウンロード
    btnDownload.addEventListener('click', () => {
      const csvString = records.map(row => row.join(",")).join("\r\n");
      const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `mobile_sensor_log_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
