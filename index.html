<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cycle Telemetry Deck</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --accent: #38bdf8;
      --impact-red: #ef4444;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow: hidden;
    }

    /* 上部ヘッダー */
    header {
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
    }
    .brand { font-size: 16px; font-weight: 800; color: var(--accent); letter-spacing: 0.05em; }
    .session-badge {
      font-size: 11px; font-family: ui-monospace, monospace;
      background: #1e293b; padding: 3px 8px; border-radius: 6px; color: #94a3b8;
    }

    /* マップ領域 (画面の約40%) */
    #map-container {
      position: relative;
      flex: 0 0 38vh;
      width: 100%;
      border-bottom: 1px solid var(--card-border);
    }
    #map { width: 100%; height: 100%; background: #0b1120; }
    .map-btn {
      position: absolute; right: 12px; bottom: 12px; z-index: 1000;
      background: rgba(19, 27, 46, 0.9); border: 1px solid #38bdf8;
      color: #38bdf8; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }

    /* 計器・コックピット領域 (画面下部) */
    .cockpit {
      flex: 1;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    /* スピードメーター & テレメトリカード */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr;
      gap: 8px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .metric-val {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 26px; font-weight: 800; color: #fff; line-height: 1.1;
    }
    .metric-unit { font-size: 11px; font-weight: 400; color: #64748b; }
    .metric-lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 2px; }

    /* カメラ・段差記録セクション */
    .survey-card {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 10px;
      margin-top: 6px;
    }
    .tag-row {
      display: flex; gap: 5px; margin-bottom: 8px; overflow-x: auto;
    }
    .tag-btn {
      flex: 1; padding: 6px 4px; font-size: 11px; font-weight: 600;
      border: 1px solid #475569; background: #1e293b; color: #cbd5e1;
      border-radius: 6px; white-space: nowrap; text-align: center;
    }
    .tag-btn.active { background: #f59e0b; color: #000; border-color: #f59e0b; font-weight: 800; }
    
    .btn-camera {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 16px; font-weight: 800;
      padding: 14px;
      border-radius: 10px;
      border: none;
      display: flex; justify-content: center; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-camera:active { transform: scale(0.98); }

    /* 操作ボタン */
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 6px; }
    .btn {
      padding: 12px 6px; border-radius: 10px; font-size: 13px; font-weight: 700;
      border: none; cursor: pointer; text-align: center;
    }
    .btn-start { background: #0284c7; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-dl { background: #10b981; color: #fff; }
    .btn:disabled { opacity: 0.3; }

    #hiddenPhotoInput { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">CYCLE TELEMETRY</div>
    <div id="sessionDisplay" class="session-badge">ID: ----</div>
  </header>

  <!-- マップビュー (走行ルート表示) -->
  <div id="map-container">
    <div id="map"></div>
    <button id="btnFollow" class="map-btn">現在地固定: ON</button>
  </div>

  <!-- 操作＆テレメトリコックピット -->
  <div class="cockpit">
    
    <!-- 主要数値グリッド -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-val"><span id="valSpeed">0.0</span></div>
        <div class="metric-unit">km/h</div>
        <div class="metric-lbl">スピード</div>
      </div>
      <div class="metric-card">
        <div class="metric-val"><span id="valAlt">-</span></div>
        <div class="metric-unit">m</div>
        <div class="metric-lbl">標高</div>
      </div>
      <div class="metric-card">
        <div class="metric-val"><span id="valNoise">0.0</span></div>
        <div class="metric-unit">RMS</div>
        <div class="metric-lbl">予備騒音</div>
      </div>
    </div>

    <!-- 段差調査 & カメラ撮影エリア -->
    <div class="survey-card">
      <div class="tag-row">
        <div class="tag-btn active" onclick="setTag(this, '段差(亀裂)')">段差(亀裂)</div>
        <div class="tag-btn" onclick="setTag(this, 'マンホール')">マンホール</div>
        <div class="tag-btn" onclick="setTag(this, '側溝段差')">側溝</div>
        <div class="tag-btn" onclick="setTag(this, '段差なし(誤検知)')">段差なし</div>
      </div>
      
      <input type="file" id="hiddenPhotoInput" accept="image/*" capture="environment">
      <button id="btnPhoto" class="btn-camera" disabled>
        <span>📸</span> 衝撃・段差を撮影 (写真記録)
      </button>
      <div id="photoStatus" style="font-size: 10px; color: #94a3b8; text-align: center; margin-top: 4px;">
        撮影地点はマップに📸ピンがドロップされます
      </div>
    </div>

    <!-- 制御ボタングループ -->
    <div class="actions">
      <button id="btnStart" class="btn btn-start">記録開始</button>
      <button id="btnStop" class="btn btn-stop" disabled>停止</button>
      <button id="btnDownload" class="btn btn-dl" disabled>CSV保存</button>
    </div>

  </div>

  <script>
    // --- Leaflet マップ初期化 (国土地理院・OpenStreetMapのDark系) ---
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([35.65, 139.41], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    let routeLine = L.polyline([], { color: '#38bdf8', weight: 4, opacity: 0.85 }).addTo(map);
    let curMarker = L.circleMarker([0, 0], { radius: 7, color: '#38bdf8', fillColor: '#fff', fillOpacity: 1 }).addTo(map);

    let followMap = true;
    document.getElementById('btnFollow').addEventListener('click', () => {
      followMap = !followMap;
      document.getElementById('btnFollow').innerText = followMap ? "現在地固定: ON" : "現在地固定: OFF";
    });

    // --- セッションID初期化 (YYYYMMDD_HHMM) ---
    const nowD = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const sessionId = `${nowD.getFullYear()}${pad(nowD.getMonth()+1)}${pad(nowD.getDate())}_${pad(nowD.getHours())}${pad(nowD.getMinutes())}`;
    document.getElementById('sessionDisplay').innerText = `ID: ${sessionId}`;

    // --- ロギングデータバッファ ---
    let records = [["timestamp", "session_id", "latitude", "longitude", "altitude", "speed", "accuracy", "sub_noise_rms", "sub_impact_g"]];
    let photoLogs = [["timestamp", "session_id", "filename", "latitude", "longitude", "altitude", "tag"]];

    let watchId = null, wakeLock = null, sampleTimer = null;
    let audioCtx = null, analyser = null, micStream = null;
    let curLat = null, curLng = null, curAlt = "", curSpd = "0.0", curAcc = "";
    let curRms = 0.0, curImpact = 0.0;
    let currentTag = "段差(亀裂)";

    function setTag(el, tag) {
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      currentTag = tag;
    }

    // カメラ撮影処理
    document.getElementById('btnPhoto').addEventListener('click', () => {
      document.getElementById('hiddenPhotoInput').click();
    });

    document.getElementById('hiddenPhotoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const now = Date.now();
      const filename = `photo_${sessionId}_${now}.jpg`;

      // 撮影メタデータ追加
      photoLogs.push([now, sessionId, filename, curLat || "", curLng || "", curAlt || "", currentTag]);

      // マップ上に撮影ピン（カメラアイコン）をドロップ
      if (curLat && curLng) {
        const photoIcon = L.divIcon({
          html: `<div style="background:#f59e0b; border:2px solid #fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 0 10px #f59e0b;">📸</div>`,
          className: '',
          iconSize: [24, 24]
        });
        L.marker([curLat, curLng], { icon: photoIcon }).addTo(map)
          .bindPopup(`<b>${currentTag}</b><br><small>${new Date(now).toLocaleTimeString()}</small>`).openPopup();
      }

      // 写真ファイルをローカル保存
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      document.getElementById('photoStatus').innerText = `記録完了: ${photoLogs.length - 1}枚 (最新: ${currentTag})`;
    });

    // 予備マイク (RMS)
    async function initAudio() {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
    }
    const aBuf = new Float32Array(256);
    function sampleAudio() {
      if (!analyser) return;
      analyser.getFloatTimeDomainData(aBuf);
      let sum = 0;
      for (let i = 0; i < aBuf.length; i++) sum += aBuf[i] * aBuf[i];
      curRms = Math.sqrt(sum / aBuf.length) * 100.0;
      document.getElementById('valNoise').innerText = curRms.toFixed(1);
    }

    // 予備加速度 (衝撃G)
    window.addEventListener('devicemotion', (e) => {
      const a = e.accelerationIncludingGravity;
      if (a && a.x !== null) {
        const tot = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
        curImpact = Math.abs((tot / 9.80665) - 1.0);
      }
    });

    // 記録開始
    document.getElementById('btnStart').addEventListener('click', async () => {
      try { await initAudio(); } catch (e) {}
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          curLat = pos.coords.latitude;
          curLng = pos.coords.longitude;
          curAlt = pos.coords.altitude !== null ? pos.coords.altitude.toFixed(1) : "";
          curSpd = pos.coords.speed !== null && pos.coords.speed >= 0 ? (pos.coords.speed * 3.6).toFixed(1) : "0.0";
          curAcc = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : "";

          document.getElementById('valSpeed').innerText = curSpd;
          document.getElementById('valAlt').innerText = curAlt || "-";

          // マップ上の軌跡更新
          const latlng = [curLat, curLng];
          curMarker.setLatLng(latlng);
          routeLine.addLatLng(latlng);
          if (followMap) map.panTo(latlng);
        },
        (err) => {},
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );

      // 100ms周期 (10Hz) 打刻
      sampleTimer = setInterval(() => {
        sampleAudio();
        const now = Date.now();
        records.push([
          now, sessionId,
          curLat !== null ? curLat.toFixed(6) : "",
          curLng !== null ? curLng.toFixed(6) : "",
          curAlt, curSpd, curAcc,
          curRms.toFixed(2), curImpact.toFixed(2)
        ]);
      }, 100);

      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStop').disabled = false;
      document.getElementById('btnPhoto').disabled = false;
      document.getElementById('btnDownload').disabled = true;
    });

    // 記録停止
    document.getElementById('btnStop').addEventListener('click', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (sampleTimer !== null) clearInterval(sampleTimer);
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      if (wakeLock) wakeLock.release().then(() => wakeLock = null);

      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
      document.getElementById('btnPhoto').disabled = true;
      document.getElementById('btnDownload').disabled = false;
    });

    // CSV ダウンロード
    document.getElementById('btnDownload').addEventListener('click', () => {
      // 1. 移動センサーログ
      const csv1 = records.map(r => r.join(",")).join("\r\n");
      downloadBlob(csv1, `mobile_${sessionId}.csv`);

      // 2. 撮影メタデータ (撮影がある場合)
      if (photoLogs.length > 1) {
        setTimeout(() => {
          const csv2 = photoLogs.map(r => r.join(",")).join("\r\n");
          downloadBlob(csv2, `photo_meta_${sessionId}.csv`);
        }, 500);
      }
    });

    function downloadBlob(content, filename) {
      const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
